<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族紀念日</title>
<script src="https://cdn.jsdelivr.net/gh/6tail/lunar-javascript@master/lunar.js"></script>
<style>
/* Reset */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Helvetica Neue',Arial,'PingFang TC','Microsoft JhengHei',sans-serif}
body{background:#f7f5f0;color:#1a1a1a;min-height:100vh}

/* Login Screen */
#lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.lock-card{background:#fff;border-radius:16px;border:1px solid #e8e4dc;padding:2.5rem 2rem;width:320px;text-align:center}
.lock-card h1{font-size:20px;font-weight:500;margin-bottom:6px}
.lock-card p{font-size:13px;color:#888;margin-bottom:1.5rem}
.lock-card input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px;text-align:center;letter-spacing:4px;margin-bottom:10px}
.lock-card button{width:100%;padding:10px;background:#4a7c59;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.lock-card button:hover{background:#3a6347}
.lock-card .err{font-size:12px;color:#c0392b;margin-top:6px;min-height:18px}

/* App Main */
#app{display:none;max-width:720px;margin:0 auto;padding:1.5rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.header h1{font-size:20px;font-weight:500}
.header .date-str{font-size:13px;color:#888}
.logout-btn{font-size:12px;color:#aaa;background:none;border:none;cursor:pointer;padding:4px 8px;margin-left:10px}
.add-btn-header{background:#4a7c59;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.add-btn-header:hover{background:#3a6347}

.tabs{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{padding:6px 16px;border-radius:8px;border:1px solid #ddd;background:transparent;cursor:pointer;font-size:13px;color:#666}
.tab.active{background:#eee;color:#1a1a1a;font-weight:500}

/* Cards */
.card{background:#fff;border:1px solid #e8e4dc;border-radius:12px;padding:14px 18px;margin-bottom:8px;cursor:pointer;transition:0.2s}
.card:hover{border-color:#ccc;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.card-row{display:flex;align-items:flex-start;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;background:#e8f0e8;color:#3a6347;margin-top:2px}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:500}
.card-meta{font-size:12px;color:#888;margin-top:2px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:360px;max-width:92vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:500;margin-bottom:1rem}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:#888;margin-bottom:4px}
.fg input,.fg select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
.fg input:disabled,.fg select:disabled{background:#f5f5f5;color:#888}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.modal-btns button{padding:7px 18px;border-radius:8px;font-size:14px;cursor:pointer}
.btn-cancel{background:#f5f5f5;border:1px solid #ddd;color:#666}
.btn-delete{background:#fdf0f0;border:1px solid #fadcdc;color:#c0392b}
.btn-save{background:#4a7c59;border:none;color:#fff;font-weight:500}

/* Utility */
.empty{text-align:center;color:#bbb;font-size:13px;padding:1.5rem}
.loading{text-align:center;color:#aaa;font-size:13px;padding:2rem}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div style="font-size:32px;margin-bottom:12px">🏡</div>
    <h1>家族紀念日</h1>
    <p>請輸入密碼進入</p>
    <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">進入</button>
    <div class="err" id="pw-err"></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div>
      <h1>家族紀念日 🌸</h1>
      <div class="date-str" id="today-str"></div>
    </div>
    <div style="display:flex; align-items:center;">
        <button class="add-btn-header" onclick="openModal('birthday')">＋ 新增</button>
        <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('upcoming')">即將到來</button>
    <button class="tab" onclick="setTab('birthday')">生日</button>
    <button class="tab" onclick="setTab('anniversary')">紀念日</button>
    <button class="tab" onclick="setTab('custom')">自訂</button>
  </div>

  <div id="view-upcoming"></div>
  <div id="view-birthday" style="display:none"></div>
  <div id="view-anniversary" style="display:none"></div>
  <div id="view-custom" style="display:none"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">新增記錄</h3>
    <div class="fg"><label>姓名 / 稱謂</label><input id="f-name" type="text" placeholder="例：媽媽、阿嬤"></div>
    <div class="fg"><label>類型</label>
      <select id="f-type" onchange="updateFields()">
        <option value="birthday_solar">生日（國曆）</option>
        <option value="anniversary">結婚紀念日</option>
        <option value="custom">自訂紀念日</option>
      </select>
    </div>
    <div class="fg" id="fg-label" style="display:none"><label>紀念日名稱</label><input id="f-label" type="text" placeholder="例：相識紀念日"></div>
    
    <div class="fg"><label>日期（直接輸入民國，例如 1150513）</label><input id="f-roc-input" type="text" placeholder="例：1150513 或 115/05/13"></div>
    <input id="f-date" type="hidden"> <div class="fg" id="fg-lunar"><label>農曆日期</label><input id="f-lunar" type="text" readonly placeholder="自動轉換"></div>
    <div class="fg"><label>生辰 <span style="font-size:11px;color:#bbb">（選填）</span></label><input id="f-birth-time" type="text" placeholder="例：午時、上午6點"></div>
    <div class="fg"><label>備註 <span style="font-size:11px;color:#bbb">（選填）</span></label><input id="f-remark" type="text" placeholder="任何備註"></div>
    
    <div class="modal-btns" id="btns-view" style="display:none">
      <button class="btn-cancel" onclick="closeModal()">關閉</button>
      <button class="btn-delete" onclick="confirmDelete()">刪除</button>
      <button class="btn-save" onclick="enableEdit()">修改</button>
    </div>
    <div class="modal-btns" id="btns-edit" style="display:none">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" id="btn-save" onclick="saveEntry()">儲存</button>
    </div>
  </div>
</div>

<script>
// --- 核心變數 ---
let data = [];
let currentTab = 'upcoming';
let currentEntryId = null; // 記錄目前正在查看/編輯的 ID

// --- 工具函數 ---
// 轉換西元為民國文字
function toRocDate(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  return `民國${y - 1911}年${m}月${d}日`;
}

// 轉換西元為民國輸入框格式 (115/05/13)
function toRocInputFormat(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${parseInt(y) - 1911}/${m}/${d}`;
}

// 自訂農曆字串，將「腊月」改為「十二月」
function getLunarString(solar) {
  const lunar = solar.getLunar();
  const m = lunar.getMonth(); // 回傳 1-12
  const d = lunar.getDayInChinese(); // 回傳 初一, 十五 等
  const monthNames = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  return `農曆 ${monthNames[m-1]}月${d}`;
}

// 解析民國輸入格式 (支援 1150513, 115/5/13, 115-05-13)
function parseRocInput(val) {
  val = val.replace(/[^\d]/g, ''); // 拔除所有非數字符號
  if(val.length >= 6 && val.length <= 7) {
      let y = val.slice(0, val.length - 4);
      let m = val.slice(-4, -2);
      let d = val.slice(-2);
      if (parseInt(m) >= 1 && parseInt(m) <= 12 && parseInt(d) >= 1 && parseInt(d) <= 31) {
          // 回傳 { 顯示格式, 系統儲存的西元格式 }
          return { rocStr: `${y}/${m}/${d}`, dateStr: `${parseInt(y)+1911}-${m}-${d}` };
      }
  }
  return null;
}

// 監聽日期輸入框
document.getElementById('f-roc-input').addEventListener('change', function() {
  if (!this.value.trim()) {
      document.getElementById('f-date').value = '';
      document.getElementById('f-lunar').value = '';
      return;
  }
  let parsed = parseRocInput(this.value);
  if (parsed) {
      this.value = parsed.rocStr;
      document.getElementById('f-date').value = parsed.dateStr;
      try {
        const [y, m, d] = parsed.dateStr.split('-').map(Number);
        const solar = window.Lunar.Solar.fromYmd(y, m, d);
        document.getElementById('f-lunar').value = getLunarString(solar);
      } catch(e) {}
  } else {
      alert('日期格式錯誤！\n請輸入有效的民國年格式，例如：1150513 或 115/05/13');
      this.value = '';
      document.getElementById('f-date').value = '';
      document.getElementById('f-lunar').value = '';
  }
});

// --- 登入與驗證 ---
async function checkPw() {
  const pw = document.getElementById('pw-input').value;
  if (!pw) return;
  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const json = await res.json();
    if (json.ok) {
      sessionStorage.setItem('auth', '1');
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      init();
    } else {
      document.getElementById('pw-err').textContent = '密碼錯誤，請再試一次';
    }
  } catch (e) {
    document.getElementById('pw-err').textContent = '連線錯誤';
  }
}

function logout() {
  sessionStorage.removeItem('auth');
  location.reload();
}

// --- 初始化 ---
async function init() {
  const d = new Date();
  const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  document.getElementById('today-str').textContent = toRocDate(todayStr);
  document.getElementById('view-upcoming').innerHTML = '<div class="loading">讀取資料中…</div>';
  try {
    const res = await fetch('/api/read');
    data = await res.json();
    render();
  } catch (e) {
    document.getElementById('view-upcoming').innerHTML = '<div class="empty" style="color:red">讀取失敗</div>';
  }
}

window.onload = function() {
  if (sessionStorage.getItem('auth') === '1') {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  }
};

// --- 介面渲染 ---
function render() {
  renderUpcoming();
  renderList('birthday');
  renderList('anniversary');
  renderList('custom');
}

function renderUpcoming() {
  let h = '';
  if (!data.length) { h = '<div class="empty">尚未新增任何記錄</div>'; }
  data.forEach(e => {
    h += `<div class="card" onclick="viewEntry('${e.id}')">
      <div class="card-row">
        <div class="avatar">${e.name.slice(0, 1)}</div>
        <div class="card-info">
          <div class="card-name">${e.name}</div>
          <div class="card-meta">${toRocDate(e.date)}</div>
          ${e.lunar ? `<div class="card-meta" style="font-size:11px;color:#aaa">${e.lunar}</div>` : ''}
        </div>
      </div>
    </div>`;
  });
  document.getElementById('view-upcoming').innerHTML = h;
}

function renderList(tab) {
  const typeMap = { birthday: ['birthday_solar'], anniversary: ['anniversary'], custom: ['custom'] };
  const entries = data.filter(e => typeMap[tab].includes(e.type));
  let h = '';
  if (!entries.length) h = '<div class="empty">尚未新增記錄</div>';
  entries.forEach(e => {
    h += `<div class="card" onclick="viewEntry('${e.id}')">
      <div class="card-row">
        <div class="avatar">${e.name.slice(0, 1)}</div>
        <div class="card-info">
          <div class="card-name">${e.name}</div>
          <div class="card-meta">${toRocDate(e.date)}</div>
          ${e.lunar ? `<div class="card-meta" style="font-size:11px;color:#aaa">${e.lunar}</div>` : ''}
        </div>
      </div>
    </div>`;
  });
  document.getElementById(`view-${tab}`).innerHTML = h;
}

function setTab(tab) {
  currentTab = tab;
  const names = { upcoming: '即將到來', birthday: '生日', anniversary: '紀念日', custom: '自訂' };
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.textContent.trim() === names[tab]);
  });
  ['upcoming', 'birthday', 'anniversary', 'custom'].forEach(t => {
    document.getElementById(`view-${t}`).style.display = (t === tab) ? '' : 'none';
  });
}

// --- Modal 互動 ---
function updateFields() {
  const t = document.getElementById('f-type').value;
  document.getElementById('fg-label').style.display = (t === 'custom') ? '' : 'none';
  document.getElementById('fg-lunar').style.display = (t === 'birthday_solar') ? '' : 'none';
}

function openModal(tab = 'birthday_solar') {
  currentEntryId = null;
  document.getElementById('modal-title').textContent = '新增記錄';
  document.getElementById('f-name').value = '';
  document.getElementById('f-type').value = (tab === 'custom') ? 'custom' : (tab === 'anniversary' ? 'anniversary' : 'birthday_solar');
  document.getElementById('f-label').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('f-roc-input').value = '';
  document.getElementById('f-lunar').value = '';
  document.getElementById('f-birth-time').value = '';
  document.getElementById('f-remark').value = '';
  
  // 切換按鈕與解鎖欄位
  document.getElementById('btns-view').style.display = 'none';
  document.getElementById('btns-edit').style.display = 'flex';
  [...document.querySelectorAll('.modal input, .modal select')].forEach(i => i.disabled = false);
  document.getElementById('f-lunar').readOnly = true; // 農曆永遠唯讀
  
  updateFields();
  document.getElementById('modal').classList.add('open');
}

function viewEntry(id) {
  const e = data.find(x => x.id === id);
  if (!e) return;
  currentEntryId = id;
  
  document.getElementById('modal-title').textContent = '記錄詳情';
  document.getElementById('f-name').value = e.name;
  document.getElementById('f-type').value = e.type;
  document.getElementById('f-label').value = e.label || '';
  document.getElementById('f-date').value = e.date;
  document.getElementById('f-roc-input').value = toRocInputFormat(e.date);
  document.getElementById('f-lunar').value = e.lunar || '';
  document.getElementById('f-birth-time').value = e.birthTime || '';
  document.getElementById('f-remark').value = e.remark || '';
  
  // 切換按鈕為查看模式，鎖定所有欄位
  document.getElementById('btns-edit').style.display = 'none';
  document.getElementById('btns-view').style.display = 'flex';
  [...document.querySelectorAll('.modal input, .modal select')].forEach(i => i.disabled = true);
  
  updateFields();
  document.getElementById('modal').classList.add('open');
}

function enableEdit() {
  document.getElementById('btns-view').style.display = 'none';
  document.getElementById('btns-edit').style.display = 'flex';
  [...document.querySelectorAll('.modal input, .modal select')].forEach(i => i.disabled = false);
  document.getElementById('f-lunar').readOnly = true;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// --- 儲存與刪除資料 ---
async function saveEntry() {
  const entry = {
    id: currentEntryId, // 如果是修改，會帶有原有的 ID
    name: document.getElementById('f-name').value.trim(),
    type: document.getElementById('f-type').value,
    date: document.getElementById('f-date').value,
    lunar: document.getElementById('f-lunar').value.trim(),
    label: document.getElementById('f-label').value.trim(),
    birthTime: document.getElementById('f-birth-time').value.trim(),
    remark: document.getElementById('f-remark').value.trim(),
  };
  
  if (!entry.name || !entry.date) {
    alert('請填寫姓名與日期');
    return;
  }
  
  const btn = document.getElementById('btn-save');
  btn.textContent = '儲存中…';
  btn.disabled = true;
  
  try {
    await fetch('/api/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry)
    });
    const res = await fetch('/api/read');
    data = await res.json();
    render();
    closeModal();
  } catch (e) {
    alert("儲存失敗，請確認網路連線");
  } finally {
    btn.textContent = '儲存';
    btn.disabled = false;
  }
}

async function confirmDelete() {
  if(!confirm('確定要刪除這筆記錄嗎？\n刪除後無法還原。')) return;
  
  try {
    await fetch('/api/write', {
        method: 'DELETE', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({id: currentEntryId})
    });
    const res = await fetch('/api/read');
    data = await res.json();
    render();
    closeModal();
  } catch(e) {
    alert('刪除失敗');
  }
}
</script>
</body>
</html>
