<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我們這一家</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#fdfaf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/609/609803.png">
<script src="https://cdn.jsdelivr.net/gh/6tail/lunar-javascript@master/lunar.js"></script>
<style>
:root {
  --bg-color: #fdfaf5;
  --card-bg: #ffffff;
  --primary-color: #e67e22;
  --text-main: #2c3e50;
  --text-light: #94a3b8;
  --accent-green: #6d8c54;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'PingFang TC','Microsoft JhengHei',sans-serif}
body{background: var(--bg-color); color: var(--text-main); min-height:100vh; -webkit-tap-highlight-color: transparent;}

/* Login */
#lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.lock-card{background:#fff;border-radius:24px;padding:3rem 2rem;width:340px;text-align:center;box-shadow: 0 10px 30px rgba(0,0,0,0.05);}
.lock-card input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:18px;text-align:center;margin-bottom:15px; outline:none;}
.lock-card button{width:100%;padding:14px;background: var(--primary-color);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold;}

/* Main App */
#app{display:none;max-width:640px;margin:0 auto;padding:1.5rem 1.2rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.header h1{font-size:26px;font-weight:900;}
.date-str{font-size:14px;color: var(--text-light);}
.add-btn-header{background: var(--accent-green);color:#fff;border:none;padding:10px 18px;border-radius:12px;font-weight:bold;}

.tabs{display:flex;gap:10px;margin-bottom:1.5rem;overflow-x:auto; padding-bottom: 5px;}
.tab{padding:10px 20px;border-radius:50px;border:none;background:#eee;font-size:14px;font-weight:bold;color: var(--text-light); white-space: nowrap;}
.tab.active{background: var(--primary-color);color:#fff;}

/* Cards */
.card{background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); cursor:pointer;}
.card-row{display:flex;align-items:center;gap:16px}
.avatar{width:50px;height:50px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;background:#fff5e9;color: var(--primary-color); flex-shrink: 0;}
.card-name{font-size:19px;font-weight:bold; color: #2c3e50;}
.card-meta{font-size:14px;color: #7f8c8d; margin-top:4px; line-height: 1.5;}
.days-chip{font-size:13px; padding: 4px 12px; border-radius: 10px; background: #f1f5f9; color: #64748b; font-weight: bold; white-space: nowrap;}
.days-chip.soon{background: #fff4ed; color: var(--primary-color);}

/* Modal Style */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center; backdrop-filter: blur(4px);}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:24px;width:95%;max-width:450px;max-height:90vh;overflow-y:auto;}
.modal-header{padding: 20px 24px; border-bottom: 1px solid #f0f0f0;}
.modal-header h3{font-size: 20px; font-weight: 900;}
.modal-content{padding: 10px 24px;}
.fg{margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #f8f8f8;}
.fg label{display:block;font-size:13px;color: #a0aec0; margin-bottom:4px;}
.fg input, .fg select{width:100%; padding: 4px 0; border: 1px solid #eee; border-radius: 8px; font-size:16px; background:#fff; outline: none;}

/* View Mode override */
.view-mode .fg input, .view-mode .fg select { border: none !important; padding: 4px 0 !important; font-size: 20px !important; font-weight: 600 !important; color: #2d3748 !important; background: transparent !important; -webkit-text-fill-color: #2d3748 !important; opacity: 1 !important;}
.view-mode .fg.empty { display: none; }

.modal-footer{padding: 20px 24px; display: flex; gap: 10px;}
.btn{flex:1; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;}
.btn-delete{ background: #fff; color: #e53e3e; border: 1px solid #fed7d7 !important; }
.btn-close{ background: #edf2f7; color: #4a5568; }
.btn-edit{ background: #3182ce; color: #fff; }
.btn-save{ background: var(--accent-green); color: #fff; width: 100%; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div style="font-size:56px;margin-bottom:12px">🏡</div>
    <h1>我們這一家</h1>
    <p style="color:#94a3b8; margin-bottom: 2rem">請輸入家族密碼</p>
    <input type="password" id="pw-input" placeholder="••••" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">進入家園</button>
  </div>
</div>

<div id="app">
  <div class="header">
    <div>
      <h1>我們這一家</h1>
      <div class="date-str" id="today-str"></div>
    </div>
    <button class="add-btn-header" onclick="openModal()">＋ 新增</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('upcoming')">即將到來</button>
    <button class="tab" onclick="setTab('birthday')">生日</button>
    <button class="tab" onclick="setTab('anniversary')">紀念日</button>
    <button class="tab" onclick="setTab('custom')">其他</button>
  </div>

  <div id="view-upcoming"></div>
  <div id="view-birthday" style="display:none"></div>
  <div id="view-anniversary" style="display:none"></div>
  <div id="view-custom" style="display:none"></div>
</div>

<div id="sync-toast" style="display:none" class="sync-toast"></div>

<div class="modal-bg" id="modal">
  <div class="modal" id="modal-container">
    <div class="modal-header"><h3 id="modal-title">紀錄內容</h3></div>
    <div class="modal-content">
      <div class="fg" id="fg-name"><label>姓名 / 稱謂</label><input id="f-name" type="text"></div>
      <div class="fg" id="fg-type"><label>類型</label>
        <select id="f-type" onchange="updateFields()">
          <option value="birthday_solar">生日</option>
          <option value="anniversary">結婚紀念日</option>
          <option value="custom">自訂紀念日</option>
        </select>
      </div>
      <div class="fg" id="fg-label"><label>名稱</label><input id="f-label" type="text"></div>
      <div class="fg" id="fg-roc"><label>日期 (民國)</label><input id="f-roc-input" type="text"></div>
      <input id="f-date" type="hidden">
      <div class="fg" id="fg-lunar"><label>農曆日期</label><input id="f-lunar" type="text" readonly></div>
      <div class="fg" id="fg-zodiac"><label>生肖 / 星座</label><input id="f-zodiac" type="text" readonly></div>
      <div class="fg" id="fg-birth-time"><label>生辰</label><input id="f-birth-time" type="text"></div>
      <div class="fg" id="fg-remark"><label>備註</label><input id="f-remark" type="text"></div>
    </div>
    <div class="modal-footer" id="btns-view" style="display:none">
      <button class="btn btn-delete" onclick="confirmDelete()">🗑 刪除</button>
      <button class="btn btn-close" onclick="closeModal()">關閉</button>
      <button class="btn btn-edit" onclick="enableEdit()">✏️ 修改</button>
    </div>
    <div class="modal-footer" id="btns-edit" style="display:none">
      <button class="btn btn-close" onclick="closeModal()" style="flex:0.4">取消</button>
      <button class="btn btn-save" id="btn-save" onclick="saveEntry()">儲存紀錄</button>
    </div>
  </div>
</div>

<script>
let data = [];
let currentEntryId = null;
const STORAGE_KEY = 'family_v1';
const MONTHS_TW = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const today = new Date();

function rocToSolar(rocStr) {
  let v = rocStr.replace(/[^\d]/g, '');
  if (v.length < 6) return null;
  const y = parseInt(v.slice(0, v.length-4)) + 1911;
  const m = v.slice(-4,-2), d = v.slice(-2);
  return `${y}-${m}-${d}`;
}

function toRocDisplay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${y - 1911}年${m}月${d}日`;
}

function getInfo(dateStr, type) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const solar = Solar.fromYmd(y, m, d);
  const lunar = solar.getLunar();
  const rawZ = lunar.getYearShengXiao();
  const cnZ = {'鼠':'鼠','牛':'牛','虎':'虎','兔':'兔','龙':'龍','蛇':'蛇','马':'馬','羊':'羊','猴':'猴','鸡':'雞','狗':'狗','猪':'豬'}[rawZ] || rawZ;
  const cutoffs = [20,19,21,20,21,22,23,23,23,24,23,22];
  const signs = ['水瓶','雙魚','牡羊','金牛','雙子','巨蟹','獅子','處女','天秤','天蠍','射手','摩羯'];
  let sIdx = m-1; if(d < cutoffs[sIdx]) sIdx = (sIdx + 11) % 12;
  const starSign = signs[sIdx];
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let age = today.getFullYear() - y;
  const thisYearBirthday = new Date(today.getFullYear(), m-1, d);
  if (t < thisYearBirthday) age--;

  return {
    lunar: `農曆 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`,
    zodiac: `${cnZ} / ${starSign}座`,
    age: Math.max(0, age)
  };
}

function getCountdown(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  let target = new Date(today.getFullYear(), m-1, d);
  const now = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (target < now) target.setFullYear(today.getFullYear() + 1);
  const diffTime = target - now;
  const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  if (totalDays === 0) return "今天 🎉";
  let tempDate = new Date(now.getTime());
  let months = 0;
  while (true) {
    let nextMonth = new Date(tempDate.getFullYear(), tempDate.getMonth() + 1, tempDate.getDate());
    if (nextMonth > target) break;
    tempDate = nextMonth;
    months++;
  }
  const days = Math.round((target - tempDate) / (1000 * 60 * 60 * 24));
  let res = "";
  if (months > 0) res += `${months} 個月 `;
  if (days > 0) res += `${days} 天`;
  return res || `${totalDays} 天`;
}

// 根據類型與頁面取得圖示
function getAvatarContent(e, isUpcoming) {
  if (e.type === 'anniversary') return '💍';
  if (isUpcoming && e.type === 'birthday_solar') return '🎂';
  return e.name[0];
}

async function init() {
  document.getElementById('today-str').textContent = toRocDisplay(`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`);
  const cached = localStorage.getItem(STORAGE_KEY);
  if (cached) { data = JSON.parse(cached); render(); }
  setTimeout(refreshData, 1000);
}

async function refreshData() {
  try {
    const res = await fetch('/api/read');
    data = await res.json();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    render();
  } catch (e) {}
}

function render() {
  ['upcoming', 'birthday', 'anniversary', 'custom'].forEach(tab => {
    let list = [];
    const isUpcomingTab = tab === 'upcoming';
    
    if(isUpcomingTab) {
      list = [...data].map(e => {
        const [y,m,d] = e.date.split('-').map(Number);
        let t = new Date(today.getFullYear(), m-1, d);
        const now = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        if(t < now) t.setFullYear(today.getFullYear()+1);
        const nextAge = t.getFullYear() - y;
        const diffDays = Math.ceil((t - now)/(1000*60*60*24));
        return {...e, diffDays, nextAge};
      }).sort((a,b) => a.diffDays - b.diffDays);
    } else {
      const map = {birthday:['birthday_solar'], anniversary:['anniversary'], custom:['custom']};
      list = data.filter(e => map[tab].includes(e.type));
    }

    let h = list.length ? '' : '<div style="text-align:center;padding:3rem;color:#ccc">尚無紀錄</div>';
    list.forEach(e => {
      const info = getInfo(e.date, e.type);
      const countdown = getCountdown(e.date);
      const avatar = getAvatarContent(e, isUpcomingTab);
      
      let subText = "";
      if (isUpcomingTab) {
        const eventName = e.type === 'birthday_solar' ? `${e.nextAge} 歲生日` : `${e.nextAge} 週年紀念`;
        subText = `<div class="card-meta" style="color:var(--primary-color); font-weight:bold">${eventName}</div>
                   <div class="card-meta">${toRocDisplay(e.date)} · ${info.lunar}</div>`;
      } else {
        if (e.type === 'anniversary') {
          // 結婚紀念日不顯示農曆星座，改顯示週年
          subText = `<div class="card-meta" style="font-size:15px; color:var(--text-main); font-weight:bold; margin-top:8px">
                     ${toRocDisplay(e.date)} · ${info.age} 週年</div>`;
        } else {
          subText = `<div class="card-meta" style="font-size:15px; color:var(--text-main); font-weight:bold; margin-top:8px">
                     ${toRocDisplay(e.date)} · ${info.age} 歲</div>
                     <div class="card-meta">${info.lunar} · ${info.zodiac}</div>`;
        }
      }

      h += `<div class="card" onclick="viewEntry('${e.id}')">
        <div class="card-row">
          <div class="avatar" style="${e.type==='anniversary'||(isUpcomingTab && e.type==='birthday_solar')?'font-size:28px':''}">${avatar}</div>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span class="card-name">${e.name}</span>
              ${isUpcomingTab ? `<span class="days-chip ${countdown==='今天 🎉'?'soon':''}">${countdown==='今天 🎉'?countdown:'剩 '+countdown}</span>` : ''}
            </div>
            ${subText}
          </div>
        </div>
      </div>`;
    });
    document.getElementById(`view-${tab}`).innerHTML = h;
  });
}

function viewEntry(id) {
  const e = data.find(x => x.id === id);
  currentEntryId = id;
  const modal = document.getElementById('modal-container');
  modal.classList.add('view-mode');
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-title').textContent = e.name;
  
  const info = getInfo(e.date, e.type);
  document.getElementById('f-name').value = e.name;
  document.getElementById('f-type').value = e.type;
  document.getElementById('f-label').value = e.label || '';
  document.getElementById('f-roc-input').value = toRocDisplay(e.date);
  document.getElementById('f-date').value = e.date;
  document.getElementById('f-lunar').value = info.lunar;
  document.getElementById('f-zodiac').value = info.zodiac;
  document.getElementById('f-birth-time').value = e.birthTime || '';
  document.getElementById('f-remark').value = e.remark || '';
  
  document.querySelectorAll('.fg').forEach(f => f.classList.remove('empty'));
  ['label','birth-time','remark'].forEach(f => {
    if (!e[f.replace('-','')] && !e[f]) document.getElementById('fg-'+f).classList.add('empty');
  });
  if (e.type !== 'birthday_solar') {
    document.getElementById('fg-lunar').classList.add('empty');
    document.getElementById('fg-zodiac').classList.add('empty');
    document.getElementById('fg-birth-time').classList.add('empty');
  }

  document.querySelectorAll('.fg input, .fg select').forEach(i => i.readOnly = true);
  document.getElementById('btns-view').style.display = 'flex';
  document.getElementById('btns-edit').style.display = 'none';
}

function enableEdit() {
  const modal = document.getElementById('modal-container');
  modal.classList.remove('view-mode');
  document.querySelectorAll('.fg input, .fg select').forEach(i => i.readOnly = false);
  document.querySelectorAll('.fg').forEach(f => f.classList.remove('empty'));
  const d = document.getElementById('f-date').value.split('-');
  document.getElementById('f-roc-input').value = (d[0]-1911)+"/"+d[1]+"/"+d[2];
  document.getElementById('btns-view').style.display = 'none';
  document.getElementById('btns-edit').style.display = 'flex';
  updateFields();
}

function openModal() {
  currentEntryId = null;
  const modal = document.getElementById('modal-container');
  modal.classList.remove('view-mode');
  document.getElementById('modal').classList.add('open');
  document.querySelectorAll('.fg input').forEach(i => i.value = '');
  document.querySelectorAll('.fg').forEach(f => f.classList.remove('empty'));
  document.querySelectorAll('.fg input, .fg select').forEach(i => i.readOnly = false);
  document.getElementById('btns-view').style.display = 'none';
  document.getElementById('btns-edit').style.display = 'flex';
  updateFields();
}

function updateFields() {
  const t = document.getElementById('f-type').value;
  document.getElementById('fg-label').style.display = t === 'custom' ? '' : 'none';
  document.getElementById('fg-lunar').style.display = t === 'birthday_solar' ? '' : 'none';
  document.getElementById('fg-zodiac').style.display = t === 'birthday_solar' ? '' : 'none';
  // 結婚紀念日與其他，不顯示生辰
  document.getElementById('fg-birth-time').style.display = t === 'birthday_solar' ? '' : 'none';
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

document.getElementById('f-roc-input').addEventListener('input', function() {
  const dateStr = rocToSolar(this.value);
  if (dateStr) {
    document.getElementById('f-date').value = dateStr;
    const info = getInfo(dateStr, document.getElementById('f-type').value);
    document.getElementById('f-lunar').value = info.lunar;
    document.getElementById('f-zodiac').value = info.zodiac;
  }
});

async function checkPw() {
  const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw-input').value }) });
  if ((await res.json()).ok) {
    sessionStorage.setItem('auth', '1');
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  }
}

async function saveEntry() {
  const entry = {
    id: currentEntryId, name: document.getElementById('f-name').value,
    type: document.getElementById('f-type').value, date: document.getElementById('f-date').value,
    birthTime: document.getElementById('f-birth-time').value, remark: document.getElementById('f-remark').value,
    label: document.getElementById('f-label').value
  };
  await fetch('/api/write', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) });
  await refreshData(); closeModal();
}

async function confirmDelete() {
  if(!confirm('確定刪除？')) return;
  await fetch('/api/write', { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: currentEntryId}) });
  await refreshData(); closeModal();
}

function setTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.getAttribute('onclick').includes(tab)));
  ['upcoming', 'birthday', 'anniversary', 'custom'].forEach(t => document.getElementById(`view-${t}`).style.display = (t === tab) ? '' : 'none');
}

window.onload = () => { if(sessionStorage.getItem('auth')) { document.getElementById('lock-screen').style.display='none'; document.getElementById('app').style.display='block'; init(); } };
</script>
</body>
</html>
