<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族紀念日</title>
<script src="https://cdn.jsdelivr.net/gh/6tail/lunar-javascript@master/lunar.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Helvetica Neue',Arial,'PingFang TC','Microsoft JhengHei',sans-serif}
body{background:#f7f5f0;color:#1a1a1a;min-height:100vh;font-size:18px;font-weight:bold;}

#lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.lock-card{background:#fff;border-radius:16px;border:1px solid #e8e4dc;padding:2.5rem 2rem;width:320px;text-align:center}
.lock-card input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:18px;text-align:center;margin-bottom:10px}
.lock-card button{width:100%;padding:12px;background:#4a7c59;color:#fff;border:none;border-radius:8px;font-size:18px;cursor:pointer}
#app{display:none;max-width:720px;margin:0 auto;padding:1.5rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.header h1{font-size:26px;font-weight:bold}
.logout-btn{font-size:15px;color:#aaa;background:none;border:none;cursor:pointer;padding:4px 8px;font-weight:bold}
.add-btn-header{background:#4a7c59;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}

.tabs{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px;border:1px solid #ddd;background:transparent;cursor:pointer;font-size:16px;font-weight:bold;color:#666}
.tab.active{background:#eee;color:#1a1a1a}

.card{background:#fff;border:1px solid #e8e4dc;border-radius:12px;padding:18px;margin-bottom:12px;cursor:pointer}
.card-name{font-size:20px;font-weight:bold;margin-bottom:4px}
.card-meta{font-size:16px;color:#555;margin-top:4px}
.badge{display:inline-block;font-size:14px;padding:2px 8px;border-radius:6px;margin-left:8px;background:#eef3ee;color:#3a6347;vertical-align:middle}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:2rem;width:400px;max-width:95vw}
.fg{margin-bottom:15px}
.fg label{display:block;font-size:15px;color:#666;margin-bottom:6px;font-weight:bold}
.fg input,.fg select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:17px;font-weight:bold}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:1.5rem}
.modal-btns button{padding:10px 20px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-save{background:#4a7c59;color:#fff;border:none}
.btn-delete{background:#c0392b;color:#fff;border:none}
</style>
</head>
<body>

<div id="lock-screen"><div class="lock-card"><h1>家族紀念日</h1><input type="password" id="pw-input" placeholder="密碼"><button onclick="checkPw()">進入</button></div></div>

<div id="app">
  <div class="header">
    <div><h1>家族紀念日 🌸</h1></div>
    <div><button class="add-btn-header" onclick="openModal()">＋ 新增</button><button class="logout-btn" onclick="logout()">登出</button></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setTab('upcoming')">即將到來</button>
    <button class="tab" onclick="setTab('birthday')">生日</button>
    <button class="tab" onclick="setTab('anniversary')">紀念日</button>
  </div>
  <div id="view-list"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">新增記錄</h3>
    <div class="fg"><label>姓名</label><input id="f-name" type="text"></div>
    <div class="fg"><label>類型</label><select id="f-type" onchange="updateFields()"><option value="birthday_solar">生日</option><option value="anniversary">結婚紀念日</option><option value="custom">自訂</option></select></div>
    <div class="fg" id="fg-label" style="display:none"><label>名稱</label><input id="f-label" type="text"></div>
    <div class="fg"><label>日期（輸入民國，如 1150513）</label><input id="f-roc-input" type="text"></div>
    <input id="f-date" type="hidden"> 
    <div class="fg" id="fg-lunar"><label>農曆 / 生肖 / 星座</label>
        <input id="f-lunar" type="text" readonly style="margin-bottom:5px">
        <div style="display:flex;gap:5px"><input id="f-zodiac" type="text" readonly></div>
    </div>
    <div class="fg" id="fg-birth-time"><label>生辰</label><input id="f-birth-time" type="text"></div>
    <div class="fg"><label>備註</label><input id="f-remark" type="text"></div>
    <div class="modal-btns" id="btns-view"><button onclick="closeModal()">關閉</button><button class="btn-delete" onclick="confirmDelete()">刪除</button><button class="btn-save" onclick="enableEdit()">修改</button></div>
    <div class="modal-btns" id="btns-edit" style="display:none"><button onclick="closeModal()">取消</button><button class="btn-save" id="btn-save" onclick="saveEntry()">儲存</button></div>
  </div>
</div>

<script>
let data=[];
const TYPE_LABEL={birthday_solar:'生日', anniversary:'紀念日', custom:'自訂'};
const ZODIAC_MAP = {'马':'馬', '龙':'龍', '鸡':'雞', '猪':'豬', '狗':'狗', '鼠':'鼠', '牛':'牛', '虎':'虎', '兔':'兔', '蛇':'蛇', '猴':'猴', '羊':'羊'};

function toRocDate(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  return `民國${y - 1911}年${m}月${d}日`;
}

function getLunarAndZodiac(val) {
  const [y, m, d] = val.split('-').map(Number);
  const solar = window.Lunar.Solar.fromYmd(y, m, d);
  const lunar = solar.getLunar();
  const mName = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  let shengxiao = ZODIAC_MAP[lunar.getYearShengXiao()] || lunar.getYearShengXiao();
  
  const cutoffs = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
  const signs = ['水瓶座', '雙魚座', '牡羊座', '金牛座', '雙子座', '巨蟹座', '獅子座', '處女座', '天秤座', '天蠍座', '射手座', '摩羯座'];
  let sIdx = m - 1;
  if (d < cutoffs[sIdx]) sIdx = (sIdx - 1 + 12) % 12;

  return {
      lunarStr: `農曆 ${mName[lunar.getMonth()-1]}月${lunar.getDayInChinese()}`,
      zodiacStr: `${shengxiao}年 / ${signs[sIdx]}`
  };
}

document.getElementById('f-roc-input').addEventListener('change', function() {
  let val = this.value.replace(/[^\d]/g, '');
  if(val.length < 6) return;
  let y = parseInt(val.slice(0, val.length-4)) + 1911;
  let m = val.slice(-4, -2);
  let d = val.slice(-2);
  let dateStr = `${y}-${m}-${d}`;
  document.getElementById('f-date').value = dateStr;
  this.value = `民國${y-1911}年${m}月${d}日`;
  
  const info = getLunarAndZodiac(dateStr);
  document.getElementById('f-lunar').value = info.lunarStr;
  document.getElementById('f-zodiac').value = info.zodiacStr;
});

async function checkPw(){
  const res = await fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password: document.getElementById('pw-input').value})});
  if((await res.json()).ok){
    sessionStorage.setItem('auth','1');
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  }
}

async function init(){
  data = await (await fetch('/api/read')).json();
  render();
}

function render(){
  const list = document.getElementById('view-list');
  let h = '';
  data.forEach(e => {
    const [y, m, d] = e.date.split('-').map(Number);
    const info = getLunarAndZodiac(e.date);
    const isBirthday = e.type === 'birthday_solar';
    
    // 計算年齡/週年
    const age = today.getFullYear() - y - (today.getMonth()+1 < m || (today.getMonth()+1 == m && today.getDate() < d) ? 1 : 0);
    const nominalAge = today.getFullYear() - y + 1; // 虛歲
    
    h += `<div class="card" onclick="viewEntry('${e.id}')">
      <div class="card-name">${e.name} <span class="badge">${TYPE_LABEL[e.type]}</span></div>
      <div class="card-meta">${toRocDate(e.date)} ${isBirthday ? `(足 ${age} 歲)` : `(滿 ${age} 週年)`}</div>
      ${isBirthday ? `<div class="card-meta">${info.lunarStr} | ${info.zodiacStr}</div>` : ''}
      ${e.birthTime ? `<div class="card-meta">生辰: ${e.birthTime}</div>` : ''}
      ${e.remark ? `<div class="card-meta">備註: ${e.remark}</div>` : ''}
    </div>`;
  });
  list.innerHTML = h;
}

function updateFields() {
  const isB = document.getElementById('f-type').value === 'birthday_solar';
  document.getElementById('fg-lunar').style.display = isB ? '' : 'none';
  document.getElementById('fg-birth-time').style.display = isB ? '' : 'none';
  document.getElementById('fg-label').style.display = !isB ? '' : 'none';
}

function openModal() {
  document.getElementById('btns-view').style.display = 'none';
  document.getElementById('btns-edit').style.display = 'flex';
  [...document.querySelectorAll('.modal input, .modal select')].forEach(i => { i.disabled = false; i.value = ''; });
  document.getElementById('modal').classList.add('open');
}

function viewEntry(id) {
  const e = data.find(x => x.id === id);
  currentEntryId = id;
  document.getElementById('f-name').value = e.name;
  document.getElementById('f-type').value = e.type;
  document.getElementById('f-roc-input').value = toRocDate(e.date);
  const info = getLunarAndZodiac(e.date);
  document.getElementById('f-lunar').value = info.lunarStr;
  document.getElementById('f-zodiac').value = info.zodiacStr;
  document.getElementById('f-birth-time').value = e.birthTime || '';
  document.getElementById('f-remark').value = e.remark || '';
  document.getElementById('btns-view').style.display = 'flex';
  document.getElementById('btns-edit').style.display = 'none';
  [...document.querySelectorAll('.modal input, .modal select')].forEach(i => i.disabled = true);
  updateFields();
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
function enableEdit(){ document.getElementById('btns-view').style.display='none'; document.getElementById('btns-edit').style.display='flex'; [...document.querySelectorAll('.modal input, .modal select')].forEach(i=>i.disabled=false); document.getElementById('f-lunar').readOnly=true; document.getElementById('f-zodiac').readOnly=true;}

async function saveEntry() {
  const entry = { id: currentEntryId, name: document.getElementById('f-name').value, type: document.getElementById('f-type').value, date: document.getElementById('f-date').value, lunar: document.getElementById('f-lunar').value, birthTime: document.getElementById('f-birth-time').value, remark: document.getElementById('f-remark').value };
  await fetch('/api/write', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entry)});
  data = await (await fetch('/api/read')).json();
  render(); closeModal();
}

async function confirmDelete() {
  if(confirm('確定刪除？')) {
    await fetch('/api/write', {method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: currentEntryId})});
    data = await (await fetch('/api/read')).json();
    render(); closeModal();
  }
}
</script>
</body>
</html>
